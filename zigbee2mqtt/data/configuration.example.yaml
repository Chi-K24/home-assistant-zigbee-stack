version: 5

mqtt:
  base_topic: zigbee2mqtt
  server: mqtt://mosquitto:1883

serial:
  port: /dev/ttyUSB0
  adapter: zstack

advanced:
  channel: 25
  network_key: GENERATE
  pan_id: GENERATE
  ext_pan_id: GENERATE
  log_level: info

frontend:
  enabled: true
  port: 8080

homeassistant:
  enabled: true

permit_join: false

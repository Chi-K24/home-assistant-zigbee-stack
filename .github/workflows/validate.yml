name: Validate public examples

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare public environment example
        run: cp .env.example .env

      - name: Validate Compose model
        run: docker compose config --quiet

      - name: Scan tracked content
        run: bash scripts/sanitize-check.sh

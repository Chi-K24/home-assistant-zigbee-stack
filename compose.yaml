name: home-automation

services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    restart: unless-stopped
    ports:
      - "127.0.0.1:1883:1883"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/config/password_file:/mosquitto/config/password_file:ro
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    networks:
      - automation

  zigbee2mqtt:
    image: ghcr.io/koenkk/zigbee2mqtt:2
    container_name: zigbee2mqtt
    restart: unless-stopped
    depends_on:
      - mosquitto
    ports:
      - "8099:8080"
    volumes:
      - ./zigbee2mqtt/data:/app/data
      - /run/udev:/run/udev:ro
    devices:
      - "${ZIGBEE_ADAPTER_PATH}:/dev/ttyUSB0"
    environment:
      TZ: "${TZ}"
      ZIGBEE2MQTT_CONFIG_MQTT_SERVER: "mqtt://mosquitto:1883"
      ZIGBEE2MQTT_CONFIG_MQTT_USER: "${Z2M_MQTT_USER}"
      ZIGBEE2MQTT_CONFIG_MQTT_PASSWORD: "${Z2M_MQTT_PASSWORD}"
      ZIGBEE2MQTT_CONFIG_SERIAL_PORT: "/dev/ttyUSB0"
      ZIGBEE2MQTT_CONFIG_SERIAL_ADAPTER: "zstack"
    networks:
      - automation

  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: homeassistant
    restart: unless-stopped
    depends_on:
      - mosquitto
    network_mode: host
    volumes:
      - ./homeassistant/config:/config
      - /etc/localtime:/etc/localtime:ro
    environment:
      TZ: "${TZ}"

networks:
  automation:
    driver: bridge
